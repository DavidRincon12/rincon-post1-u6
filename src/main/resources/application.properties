spring.application.name=pedidos-service
# MODE=LEGACY habilita CALL IDENTITY(), que H2 2.x retiro del modo por defecto.
# Nombre unico por contexto: las pruebas levantan contextos con distinta configuracion de campanas
# y no deben compartir (ni reinicializar) la misma base en memoria.
spring.datasource.url=jdbc:h2:mem:pedidos-${random.uuid};MODE=LEGACY;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Campana de Black Friday: 25% fijo mientras este activa
promo.black-friday.activa=false
